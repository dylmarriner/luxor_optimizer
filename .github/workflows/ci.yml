name: ci

on:
  push:
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      # One workspace now, so the helper crate's tests are no longer a
      # separate invocation that was easy to forget.
      - name: Run tests
        run: cargo test --workspace --all-targets

      - name: Check formatting
        run: cargo fmt --all --check || echo "::warning::rustfmt differences present"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings || echo "::warning::clippy findings present"

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  package-appimage:
    runs-on: ubuntu-latest
    needs: [rust-tests, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      - run: npm ci
      - run: cargo build --release -p luxor-helper
      - run: ./scripts/stage-helper.sh
      - run: ./scripts/build-appimage.sh
