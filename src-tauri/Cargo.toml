[package]
name = "luxor_optimizer"
description = "Production-grade Linux desktop optimization suite"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "luxor_optimizer_lib"
crate-type = ["lib", "cdylib"]

# The Tauri shell only wires commands to luxor-core; logic does not live here.

[dependencies]
luxor-core.workspace = true
luxor-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.0.0", features = [] }

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
