[workspace]
resolver = "2"
members = [
    "crates/luxor-ipc",
    "crates/luxor-helper",
    "crates/luxor-core",
    "crates/luxor-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
luxor-ipc = { path = "crates/luxor-ipc" }
luxor-core = { path = "crates/luxor-core" }
anyhow = "1.0"
blake3 = "1.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
hostname = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"
uuid = { version = "1.11", features = ["serde", "v4"] }
walkdir = "2.5"
which = "6.0"
